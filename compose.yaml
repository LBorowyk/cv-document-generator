services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-document-generator
    ports:
      - "3000:3000"
    command: npm run dev

    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json

volumes:
  node_modules: