services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-backend
    ports:
      - "3000:3000"
    command: npm run dev
    volumes:
      - backend_node_modules:/app/node_modules

    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src

        - action: rebuild
          path: ./backend/package.json

        - action: rebuild
          path: ./backend/package-lock.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cv-frontend
    ports:
      - "4200:4200"
    command: npm start -- --host 0.0.0.0
    depends_on:
      - backend
    volumes:
      - frontend_node_modules:/app/node_modules

    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

        - action: sync+restart
          path: ./frontend/angular.json
          target: /app/angular.json

        - action: sync+restart
          path: ./frontend/tsconfig.json
          target: /app/tsconfig.json

        - action: rebuild
          path: ./frontend/package.json

        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  backend_node_modules:
    name: cv-backend-node-modules

  frontend_node_modules:
    name: cv-frontend-node-modules